<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anne's Daily Quiz</title>
  <style>
    :root {
      --bg-color: #fcfbf7;
      --card-bg: #ffffff;
      --text-color: #1a1a1a;
      --accent-color: #2b2b2b;
      --border-color: #d1d1d1;
      --correct-bg: #e6f4ea;
      --correct-border: #2e7d32;
      --wrong-bg: #fce8e6;
      --wrong-border: #c62828;
      --button-bg: #f4f3ef;
      --button-hover: #e8e6e0;
      --font-family: Georgia, 'Times New Roman', Times, serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-family);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .quiz-container {
      max-width: 650px;
      width: 100%;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 30px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    .header {
      text-align: center;
      border-bottom: 2px solid var(--accent-color);
      padding-bottom: 15px;
      margin-bottom: 25px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .header p {
      margin: 5px 0 0 0;
      font-style: italic;
      color: #555;
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      margin-bottom: 20px;
      font-size: 14px;
      font-weight: bold;
    }

    .question-card {
      margin-bottom: 20px;
    }

    .question-text {
      font-size: 18px;
      line-height: 1.4;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      background-color: var(--button-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 12px 16px;
      font-family: var(--font-family);
      font-size: 16px;
      text-align: left;
      cursor: pointer;
      border-radius: 4px;
      transition: background-color 0.2s;
    }

    .option-btn:hover:not(:disabled) {
      background-color: var(--button-hover);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background-color: var(--correct-bg) !important;
      border-color: var(--correct-border) !important;
      font-weight: bold;
    }

    .option-btn.wrong {
      background-color: var(--wrong-bg) !important;
      border-color: var(--wrong-border) !important;
    }

    .feedback-box {
      margin-top: 20px;
      padding: 15px;
      border-radius: 4px;
      background-color: #f9f9f9;
      border-left: 4px solid var(--accent-color);
      font-size: 15px;
      line-height: 1.4;
    }

    .next-btn, .reset-btn {
      margin-top: 25px;
      width: 100%;
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      padding: 12px;
      font-size: 16px;
      font-family: var(--font-family);
      cursor: pointer;
      border-radius: 4px;
    }

    .next-btn:hover, .reset-btn:hover {
      background-color: #444;
    }

    .hidden {
      display: none !important;
    }

    .scorecard {
      text-align: center;
    }

    .scorecard h2 {
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .scorecard .score-display {
      font-size: 32px;
      font-weight: bold;
      margin: 15px 0;
    }

    .scorecard .cumulative-display {
      font-size: 16px;
      color: #666;
      margin-bottom: 20px;
    }

    .scorecard .feedback-text {
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 25px;
    }
  </style>
</head>
<body>

<div class="quiz-container">
  <div class="header">
    <h1>Anne's Daily Quiz</h1>
    <p>Broadsheet Edition</p>
  </div>

  <div id="quiz-ui">
    <div class="stats-bar">
      <span id="question-tracker">Question 1 of 15</span>
      <span id="session-score">Score: 0</span>
    </div>

    <div class="question-card">
      <div id="question-text" class="question-text"></div>
      <div id="options-container" class="options-grid"></div>
    </div>

    <div id="feedback-box" class="feedback-box hidden"></div>

    <button id="next-btn" class="next-btn hidden" onclick="nextQuestion()">Next Question</button>
  </div>

  <div id="scorecard-ui" class="scorecard hidden">
    <h2>Quiz Complete</h2>
    <div id="final-score" class="score-display"></div>
    <div id="cumulative-score" class="cumulative-display"></div>
    <div id="final-feedback" class="feedback-text"></div>
    <button class="reset-btn" onclick="restartQuiz()">Start Fresh Quiz</button>
  </div>
</div>

<script>
  const questions = [
    {
      q: "1. Which 1971 album by David Bowie featured the iconic track 'Life on Mars?' and marked his transition toward glam rock?",
      options: ["The Man Who Sold the World", "Hunky Dory", "Aladdin Sane", "Space Oddity"],
      answer: 1,
      bite: "'Hunky Dory' was Bowie's fourth studio album and laid the foundational artistic style for his famous Ziggy Stardust persona."
    },
    {
      q: "2. Which innovative 1968 Stanley Kubrick film famously featured the blue Danube waltz during its orbital space station sequences?",
      options: ["Solaris", "2001: A Space Odyssey", "Silent Running", "A Clockwork Orange"],
      answer: 1,
      bite: "Kubrick used Johann Strauss II's 'The Blue Danube' to give space travel a grace and rhythm resembling a delicate ballet."
    },
    {
      q: "3. Completed in 1872 under Sir Charles Todd, which northern coastal settlement served as the Australian terminus for the Overland Telegraph Line?",
      options: ["Broome", "Port Darwin", "Palmerston North", "Cooktown"],
      answer: 1,
      bite: "The line linked Adelaide directly to Port Darwin, where an undersea cable connected Australia to Java and the rest of the world."
    },
    {
      q: "4. In Agatha Christie's 1942 novel 'The Body in the Library', in whose residence is the victim's body unexpectedly discovered?",
      options: ["Colonel and Mrs. Bantry", "Jane Marple", "Superintendent Slack", "Sir Henry Clithering"],
      answer: 0,
      bite: "The victim is found in Gossington Hall, the home of Arthur and Dolly Bantry, prompting Mrs. Bantry to call her friend Miss Marple."
    },
    {
      q: "5. Which 1980s synth-pop group had a massive global hit with 'Blue Monday', often cited as the best-selling 12-inch single of all time?",
      options: ["Depeche Mode", "New Order", "Pet Shop Boys", "Tears for Fears"],
      answer: 1,
      bite: "Released in 1983 by New Order, 'Blue Monday' stood out for its distinctive die-cut floppy disk sleeve designed by Peter Saville."
    },
    {
      q: "6. What structural function does a first-flush diverter serve in domestic rainwater harvesting systems?",
      options: ["Maintains water pressure in low taps", "Isolates the initial dirty roof runoff from entering the tank", "Automatically chlorinates incoming water", "Filters out heavy metal minerals"],
      answer: 1,
      bite: "First-flush diverters channel the first batch of rainfall (containing dust, pollen, and debris) away from your primary water storage."
    },
    {
      q: "7. Which famous New Zealand television detective series, set in a fictional town, follows Detective Senior Sergeant Mike Shepherd?",
      options: ["Top of the Lake", "The Brokenwood Mysteries", "My Life Is Murder", "Shortland Street"],
      answer: 1,
      bite: "Mike Shepherd is famous for driving a classic 1971 Holden Kingswood and listening to country-western audio cassettes while solving cases."
    },
    {
      q: "8. Directed by Quentin Tarantino in 1994, which Palme d'Or winner intertwined multiple Los Angeles crime stories in a non-linear narrative?",
      options: ["Reservoir Dogs", "Pulp Fiction", "Jackie Brown", "True Romance"],
      answer: 1,
      bite: "'Pulp Fiction' revitalized John Travolta's career and became a definitive cultural landmark of 1990s cinema."
    },
    {
      q: "9. Which New South Wales mountain range hosts the Siding Spring Observatory, home to Australia's premier optical telescopes?",
      options: ["The Blue Mountains", "The Warrumbungles", "The Snowy Mountains", "The MacDonnell Ranges"],
      answer: 1,
      bite: "Siding Spring Observatory sits on the edge of the Warrumbungle National Park, benefiting from dark skies and low light pollution."
    },
    {
      q: "10. What traditional Japanese technique preserves exterior timber planks by charring them with fire?",
      options: ["Kintsugi", "Shou Sugi Ban", "Tatami", "Kumiko"],
      answer: 1,
      bite: "Shou Sugi Ban (Yakisugi) creates a durable, carbonized layer that protects wood against weather, rot, insects, and decay."
    },
    {
      q: "11. Which 1977 Fleetwood Mac album was written during intense personal turbulence among band members and went on to sell over 40 million copies?",
      options: ["Tusk", "Rumours", "Mirage", "Tango in the Night"],
      answer: 1,
      bite: "'Rumours' produced classic singles like 'Go Your Own Way', 'Dreams', and 'Don't Stop', staying atop global album charts for months."
    },
    {
      q: "12. In automotive technology, what capability does 'V2L' (Vehicle-to-Load) provide to an electric vehicle owner?",
      options: ["Powers external AC electrical devices directly from the car's battery", "Increases high-speed charging rate by 50%", "Measures luggage cargo capacity automatically", "Locks doors automatically upon driver departure"],
      answer: 0,
      bite: "V2L lets an EV function as a portable power station, operating appliances, tools, or camping equipment directly from the car battery."
    },
    {
      q: "13. Which historic Melbourne roasting company, established in 1938 on Shield Street, is famous for introducing Italian-style espresso to Victoria?",
      options: ["Seven Seeds", "Quists Coffee", "St Ali", "Proud Mary"],
      answer: 1,
      bite: "Quists Coffee is celebrated as Melbourne's first dedicated coffee roaster, supplying specialty single-origin and blended beans for decades."
    },
    {
      q: "14. Directed by Ridley Scott in 1982, which sci-fi noir masterpiece features Harrison Ford as a detective hunting synthetic humanoids in 2019 Los Angeles?",
      options: ["Total Recall", "Blade Runner", "The Running Man", "Escape from New York"],
      answer: 1,
      bite: "Adapted from Philip K. Dick's story, 'Blade Runner' set the aesthetic standard for modern cyberpunk cinema."
    },
    {
      q: "15. Which Australian musical icon achieved international chart-topping success in 2001 with 'Can't Get You Out of My Head'?",
      options: ["Tina Arena", "Kylie Minogue", "Delta Goodrem", "Natalie Imbruglia"],
      answer: 1,
      bite: "The track's hypnotic 'la la la' hook became one of the most played pop records of the decade across Europe and Australia."
    }
  ];

  let currentIdx = 0;
  let currentScore = 0;

  function initApp() {
    currentIdx = 0;
    currentScore = 0;
    document.getElementById('quiz-ui').classList.remove('hidden');
    document.getElementById('scorecard-ui').classList.add('hidden');
    renderQuestion();
  }

  function renderQuestion() {
    const q = questions[currentIdx];
    document.getElementById('question-tracker').innerText = `Question ${currentIdx + 1} of ${questions.length}`;
    document.getElementById('session-score').innerText = `Score: ${currentScore}`;
    document.getElementById('question-text').innerText = q.q;

    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';

    q.options.forEach((optText, idx) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerText = `${String.fromCharCode(65 + idx)}) ${optText}`;
      btn.onclick = () => selectOption(idx);
      optionsContainer.appendChild(btn);
    });

    document.getElementById('feedback-box').classList.add('hidden');
    document.getElementById('next-btn').classList.add('hidden');
  }

  function selectOption(selectedIdx) {
    const q = questions[currentIdx];
    const buttons = document.querySelectorAll('.option-btn');

    buttons.forEach((btn, idx) => {
      btn.disabled = true;
      if (idx === q.answer) {
        btn.classList.add('correct');
      } else if (idx === selectedIdx) {
        btn.classList.add('wrong');
      }
    });

    if (selectedIdx === q.answer) {
      currentScore++;
      document.getElementById('session-score').innerText = `Score: ${currentScore}`;
    }

    const feedbackBox = document.getElementById('feedback-box');
    feedbackBox.innerText = q.bite;
    feedbackBox.classList.remove('hidden');

    const nextBtn = document.getElementById('next-btn');
    if (currentIdx === questions.length - 1) {
      nextBtn.innerText = 'Show Final Scorecard';
    } else {
      nextBtn.innerText = 'Next Question';
    }
    nextBtn.classList.remove('hidden');
  }

  function nextQuestion() {
    if (currentIdx < questions.length - 1) {
      currentIdx++;
      renderQuestion();
    } else {
      showScorecard();
    }
  }

  function showScorecard() {
    document.getElementById('quiz-ui').classList.add('hidden');
    document.getElementById('scorecard-ui').classList.remove('hidden');

    let totalQuizzes = parseInt(localStorage.getItem('anne_quiz_total_quizzes') || '0') + 1;
    let totalScore = parseInt(localStorage.getItem('anne_quiz_total_score') || '0') + currentScore;
    let totalQuestions = parseInt(localStorage.getItem('anne_quiz_total_questions') || '0') + questions.length;

    localStorage.setItem('anne_quiz_total_quizzes', totalQuizzes);
    localStorage.setItem('anne_quiz_total_score', totalScore);
    localStorage.setItem('anne_quiz_total_questions', totalQuestions);

    let avgScore = ((totalScore / totalQuestions) * 100).toFixed(0);

    document.getElementById('final-score').innerText = `${currentScore} / ${questions.length}`;
    document.getElementById('cumulative-score').innerText = 
      `Running Total: ${totalScore} correct across ${totalQuizzes} session(s) (${avgScore}% overall average)`;

    const feedbackEl = document.getElementById('final-feedback');
    if (currentScore >= 13) {
      feedbackEl.innerText = "Mastermind Status! You sailed through 70s rock, classic cinema, science, and history without missing a beat over morning coffee!";
    } else if (currentScore >= 9) {
      feedbackEl.innerText = "Splendid Work! Sharp instincts across every genre. Another quick sip of coffee and you'll clear the board next time!";
    } else {
      feedbackEl.innerText = "Fine Warm-Up Effort! A tough set of questions today, but a great start to the morning!";
    }
  }

  function restartQuiz() {
    initApp();
  }

  window.onload = initApp;
</script>

</body>
</html>
